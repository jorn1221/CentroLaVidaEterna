plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jorncarigao9.centrolavidaeterna'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jorncarigao9.centrolavidaeterna'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
}
