
name: Build Centro La Vida Eterna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install platform tools
        run: sdkmanager --install "platform-tools"

      - name: Install Android platform 35
        run: sdkmanager --install "platforms;android-35"

      - name: Install Android build tools
        run: sdkmanager --install "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android project files
        run: |
          echo "Checking Android project..."
          ls -la android-app
          ls -la android-app/app

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug

      - name: Verify APK
        run: |
          test -f android-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk CentroLaVidaEterna-Songbook.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CentroLaVidaEterna-Songbook-APK
          path: CentroLaVidaEterna-Songbook.apk
          if-no-files-found: error
