name: Build Centro La Vida Eterna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'uecf-worship-songbook-final/android-app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "PATH=$PATH"
          command -v sdkmanager
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android project
        working-directory: uecf-worship-songbook-final/android-app
        run: |
          ls -la
          test -f gradlew || {
            echo "ERROR: gradlew file is missing from android-app."
            exit 1
          }

      - name: Build debug APK
        working-directory: uecf-worship-songbook-final/android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Centro-La-Vida-Eterna-APK
          path: uecf-worship-songbook-final/android-app/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
